services:
  postgres:
    image: postgres:16-alpine
    container_name: niva-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-niva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-niva_prod_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-niva_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-niva}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niva-net

  redis:
    image: redis:7-alpine
    container_name: niva-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - niva-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: niva-prod-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-niva}:${POSTGRES_PASSWORD:-niva_prod_secure_password_2026}@postgres:5432/${POSTGRES_DB:-niva_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-niva_production_super_secret_jwt_key_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - server_uploads:/app/uploads
      - server_backups:/app/backups
    networks:
      - niva-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: niva-prod-client
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      server:
        condition: service_healthy
    networks:
      - niva-net

  nginx:
    image: nginx:alpine
    container_name: niva-prod-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_healthy
    networks:
      - niva-net

volumes:
  postgres_prod_data:
  redis_prod_data:
  server_uploads:
  server_backups:

networks:
  niva-net:
    driver: bridge
